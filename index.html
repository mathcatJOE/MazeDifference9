<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>方格迷宮：尋找相差為 9 的路徑！</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for Victory -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Mochiy+Pop+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Noto Sans TC', 'Fredoka One', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Responsive Grid Container */
        .game-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 4px solid #ffffff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), inset 0 0 15px rgba(255, 255, 255, 0.6);
            border-radius: 2rem;
        }

        .maze-grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            grid-template-rows: repeat(5, minmax(0, 1fr));
            gap: 6px;
            position: relative;
        }

        @media (min-width: 768px) {
            .maze-grid {
                gap: 10px;
            }
        }

        /* Grid Cell Styling */
        .grid-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            border-radius: 0.75rem;
            background: #ffffff;
            color: #334155;
            box-shadow: 0 4px 0 #cbd5e1, 0 6px 10px rgba(0,0,0,0.05);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            cursor: pointer;
            border: 2px solid #f1f5f9;
        }

        .grid-cell:hover:not(.disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #cbd5e1, 0 8px 12px rgba(0,0,0,0.08);
        }

        .grid-cell:active:not(.disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cbd5e1;
        }

        /* Cell States */
        .grid-cell.visited {
            background: linear-gradient(135deg, #fef08a 0%, #fde047 100%);
            color: #854d0e;
            box-shadow: 0 4px 0 #eab308;
            border-color: #facc15;
        }

        .grid-cell.current {
            background: linear-gradient(135deg, #86efac 0%, #22c55e 100%);
            color: #14532d;
            box-shadow: 0 4px 0 #16a34a, 0 0 15px rgba(74, 222, 128, 0.6);
            border-color: #4ade80;
            animation: pulse-light 1.5s infinite;
        }

        /* 所有相鄰未經過格子統一顯示藍色虛線框 */
        .grid-cell.adjacent-target {
            border: 2.5px dashed #3b82f6 !important;
            background: #eff6ff;
            animation: bounce-subtle 1.2s infinite ease-in-out;
        }

        /* Error state animation */
        .grid-cell.wrong-shake {
            background: #ffe4e6 !important;
            border-color: #f43f5e !important;
            animation: shake 0.4s ease-in-out;
        }

        /* Cell Animations */
        @keyframes pulse-light {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }

        /* Avatar Pin Overlay - Corner Badge Style */
        .avatar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
            transition: all 0.3s cubic-bezier(0.34, 1.3, 0.64, 1);
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
        }

        .avatar-badge {
            background: #ffffff;
            border: 2px solid #ff7675;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 9999px;
            padding: 2px 4px;
            transform: translate(25%, -25%);
            animation: happy-bounce 0.8s infinite alternate ease-in-out;
        }

        @keyframes happy-bounce {
            0% { transform: translate(25%, -25%) translateY(0) scale(1); }
            100% { transform: translate(25%, -25%) translateY(-5px) scale(1.1); }
        }

        /* SVG Connecting Line Layer */
        .path-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Heart Animation */
        .heart-icon {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="p-2 sm:p-4 text-slate-800 flex flex-col justify-between items-center h-screen w-screen">

    <!-- Header / Title Bar -->
    <header class="w-full max-w-4xl flex items-center justify-between bg-white/70 backdrop-blur-md rounded-2xl px-4 py-2 shadow-sm border border-white/80">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🌈</span>
            <h1 class="text-lg sm:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500">
                方格迷宮：尋找相差為 9 的路徑！
            </h1>
        </div>
        <div class="flex items-center space-x-2 sm:space-x-3">
            <button id="sound-btn" onclick="toggleSound()" class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold shadow-sm hover:bg-indigo-200 transition">

    <!-- Main Game Play Area -->
    <main class="w-full max-w-4xl flex-1 flex flex-col justify-center items-center my-2 relative">
        <div id="game-card" class="game-card w-full p-3 sm:p-6 relative flex flex-col items-center">
            
            <!-- Game Info Bar (Hearts, Rules & Step Count) -->
            <div class="w-full flex justify-between items-center mb-3 px-1 sm:px-2">
                <!-- Hearts / Lives -->
                <div class="flex items-center space-x-1 sm:space-x-2 bg-rose-50 px-2.5 sm:px-3 py-1.5 rounded-full border border-rose-200">
                    <span class="text-xs sm:text-sm font-bold text-rose-500 mr-0.5">機會：</span>
                    <div id="hearts-container" class="flex space-x-1 text-lg sm:text-2xl text-rose-500">
                        <i class="fas fa-heart heart-icon"></i>
                        <i class="fas fa-heart heart-icon"></i>
                        <i class="fas fa-heart heart-icon"></i>
                    </div>
                </div>

                <!-- Rule Hints (Two Rules) -->
                <div class="hidden md:flex flex-col items-center space-y-1">
                    <div class="flex items-center space-x-1.5 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100 text-indigo-700 text-xs font-bold">
                        <i class="fas fa-lightbulb text-amber-400"></i>
                        <span>規則一：相鄰格子數字剛好 相差 9 才可以走喔！</span>
                    </div>
                    <div class="flex items-center space-x-1.5 bg-amber-50 px-3 py-1 rounded-full border border-amber-200 text-amber-800 text-xs font-bold">
                        <i class="fas fa-check-circle text-amber-500"></i>
                        <span>規則二：每個格子只能經過一次！</span>
                    </div>
                </div>

                <!-- Step Count HUD -->
                <div class="flex items-center bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200 text-emerald-700 text-xs sm:text-sm font-bold">
                    <span>經過方格：<span id="step-count" class="text-base sm:text-lg text-emerald-600 font-extrabold">1</span> 格</span>
                </div>
            </div>

            <!-- Mobile Rules Row (shown on small screens) -->
            <div class="flex md:hidden flex-col items-center space-y-1 w-full mb-2">
                <div class="bg-indigo-50 px-3 py-0.5 rounded-full border border-indigo-100 text-indigo-700 text-[11px] font-bold text-center">
                    💡 規則一：相鄰格子數字剛好相差 9 才可以走
                </div>
                <div class="bg-amber-50 px-3 py-0.5 rounded-full border border-amber-200 text-amber-800 text-[11px] font-bold text-center">
                    💡 規則二：每個格子只能經過一次
                </div>
            </div>

            <!-- Maze Board Area -->
            <div id="board-container" class="w-full relative">
                <!-- SVG layer for path rendering -->
                <svg id="path-svg" class="path-svg"></svg>
                
                <!-- 5x8 Grid -->
                <div id="maze-grid" class="maze-grid w-full"></div>

                <!-- Floating Animal Badge -->
                <div id="avatar-container" class="avatar-container hidden">
                    <div class="avatar-badge">
                        <span id="avatar-sprite" class="text-xl sm:text-3xl leading-none">🐱</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Start Screen Modal (Character Selection) -->
    <div id="start-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl border-4 border-amber-300 transform transition-all scale-100">
            <div class="text-4xl mb-2">🎪</div>

            <p class="text-slate-500 text-sm mb-6 font-medium">選一隻你最喜歡的小動物，一起闖關吧！</p>
            
            <!-- Character Options -->
            <div class="grid grid-cols-3 gap-3 mb-8">
                <button onclick="selectCharacter('🐱', '貓咪')" class="char-btn group flex flex-col items-center p-3 sm:p-4 rounded-2xl bg-amber-50 border-2 border-amber-200 hover:border-amber-400 hover:bg-amber-100 transition shadow-sm">
                    <span class="text-5xl sm:text-6xl group-hover:scale-110 transition duration-200">🐱</span>
                    <span class="mt-2 text-sm font-bold text-amber-800">小貓咪</span>
                </button>
                <button onclick="selectCharacter('🐶', '狗狗')" class="char-btn group flex flex-col items-center p-3 sm:p-4 rounded-2xl bg-sky-50 border-2 border-sky-200 hover:border-sky-400 hover:bg-sky-100 transition shadow-sm">
                    <span class="text-5xl sm:text-6xl group-hover:scale-110 transition duration-200">🐶</span>
                    <span class="mt-2 text-sm font-bold text-sky-800">小狗狗</span>
                </button>
                <button onclick="selectCharacter('🐻', '熊熊')" class="char-btn group flex flex-col items-center p-3 sm:p-4 rounded-2xl bg-rose-50 border-2 border-rose-200 hover:border-rose-400 hover:bg-rose-100 transition shadow-sm">
                    <span class="text-5xl sm:text-6xl group-hover:scale-110 transition duration-200">🐻</span>

                </button>
            </div>

            <button id="start-btn" onclick="startGame()" disabled class="w-full py-3.5 bg-slate-300 text-white font-black text-lg rounded-2xl shadow-lg transition duration-200">
                請先選擇角色
            </button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-rose-400">
            <div class="text-6xl mb-3 animate-bounce">💔</div>
            <h2 class="text-2xl sm:text-3xl font-black text-rose-600 mb-2">再試一次吧！</h2>
            <p class="text-slate-600 text-sm mb-6">愛心用光囉！記得相鄰格子數字要「相差 9」且「不能重複經過」喔！</p>
            <button onclick="restartGame()" class="w-full py-3.5 bg-gradient-to-r from-rose-500 to-pink-500 text-white font-black text-lg rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition">
                <i class="fas fa-rotate-right mr-2"></i>重新挑戰
            </button>
        </div>
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-emerald-400">
            <div class="text-6xl mb-3">🏆</div>
            <h2 class="text-2xl sm:text-3xl font-black text-emerald-600 mb-2">太棒了！成功闖關！</h2>
            <p class="text-slate-600 text-sm mb-2">你成功引導 <span id="victory-char" class="font-bold"></span> 走出迷宮！</p>
            <p class="text-indigo-600 font-extrabold text-base mb-6">一共經過了 <span id="victory-steps" class="text-xl text-amber-500"></span> 個方格！</p>
            <button onclick="restartGame()" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-black text-lg rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition">
                <i class="fas fa-play mr-2"></i>再玩一次
            </button>
        </div>
    </div>

    <!-- Game Script -->
    <script>
        // Maze Matrix Data (5 rows x 8 columns) from prompt image
        const gridData = [
            [9, 18, 27, 36, 45, 54, 63, 54],
            [72, 63, 18, 45, 18, 27, 36, 63],
            [81, 54, 27, 54, 9, 18, 27, 54],
            [90, 45, 36, 45, 36, 27, 36, 45],
            [81, 72, 63, 54, 27, 18, 9, 18]
        ];

        const ROWS = 5;
        const COLS = 8;
        const START_POS = { r: 0, c: 0 };
        const END_POS = { r: 4, c: 7 };

        // Game State Variables
        let selectedAvatar = '🐱';
        let selectedAvatarName = '貓咪';
        let path = [START_POS];
        let hearts = 3;
        let isSoundOn = true;
        let gameActive = false;

        // Audio & Music Synthesizer Controller using Web Audio API
        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.bgmTimer = null;
                this.bgmIndex = 0;
                // Gentle continuous waltz-style melody harmonic notes
                this.melody = [
                    523.25, 659.25, 783.99, 659.25, // C5, E5, G5, E5
                    587.33, 698.46, 880.00, 698.46, // D5, F5, A5, F5
                    523.25, 659.25, 783.99, 1046.50,// C5, E5, G5, C6
                    493.88, 659.25, 783.99, 587.33  // B4, E5, G5, D5
                ];
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            startBGM() {
                this.init();
                if (this.bgmTimer) clearInterval(this.bgmTimer);
                this.bgmIndex = 0;
                
                // Play soft smooth continuous melody note every 450ms
                this.bgmTimer = setInterval(() => {
                    if (!isSoundOn || !gameActive) return;
                    this.playSoftNote(this.melody[this.bgmIndex % this.melody.length], 0.4);
                    this.bgmIndex++;
                }, 450);
            }

            stopBGM() {
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }

            playSoftNote(freq, duration) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine'; // Soft round sine wave
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    
                    // Smooth Attack & Release
                    gain.gain.setValueAtTime(0, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.04, this.ctx.currentTime + 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }

            playStep() {
                if (!isSoundOn) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playError() {
                if (!isSoundOn) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playWin() {
                if (!isSoundOn) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.12);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.12 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.12);
                    osc.stop(this.ctx.currentTime + idx * 0.12 + 0.3);
                });
            }
        }

        const audioSys = new AudioSystem();

        // Initialize Page
        window.addEventListener('DOMContentLoaded', () => {
            renderGrid();
            window.addEventListener('resize', updatePathAndAvatarPosition);
        });

        // Render Initial Grid
        function renderGrid() {
            const gridEl = document.getElementById('maze-grid');
            gridEl.innerHTML = '';

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.id = `cell-${r}-${c}`;
                    cell.dataset.r = r;
                    cell.dataset.c = c;

                    // Inner Number Text
                    const numSpan = document.createElement('span');
                    numSpan.className = 'text-lg sm:text-2xl md:text-3xl font-extrabold';
                    numSpan.innerText = gridData[r][c];
                    cell.appendChild(numSpan);

                    // Start/End Badges
                    if (r === START_POS.r && c === START_POS.c) {
                        const badge = document.createElement('span');
                        badge.className = 'absolute -top-2 -left-2 bg-rose-500 text-white text-[10px] sm:text-xs font-black px-1.5 py-0.5 rounded-md shadow z-10';
                        badge.innerText = 'START';
                        cell.appendChild(badge);
                    } else if (r === END_POS.r && c === END_POS.c) {
                        const badge = document.createElement('span');
                        badge.className = 'absolute -bottom-2 -right-2 bg-emerald-500 text-white text-[10px] sm:text-xs font-black px-1.5 py-0.5 rounded-md shadow z-10';
                        badge.innerText = 'END';
                        cell.appendChild(badge);
                    }

                    cell.addEventListener('click', () => handleCellClick(r, c));
                    gridEl.appendChild(cell);
                }
            }
        }

        // Character Selection Logic
        function selectCharacter(emoji, name) {
            selectedAvatar = emoji;
            selectedAvatarName = name;
            
            document.querySelectorAll('.char-btn').forEach(btn => {
                btn.classList.remove('ring-4', 'ring-indigo-400', 'scale-105');
            });
            event.currentTarget.classList.add('ring-4', 'ring-indigo-400', 'scale-105');

            const startBtn = document.getElementById('start-btn');
            startBtn.disabled = false;
            startBtn.className = 'w-full py-3.5 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-black text-lg rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition duration-200 cursor-pointer';
            startBtn.innerText = `與${name}一起出發！`;
        }

        // Start Game Action
        function startGame() {
            document.getElementById('start-modal').classList.add('hidden');
            document.getElementById('avatar-sprite').innerText = selectedAvatar;
            document.getElementById('avatar-container').classList.remove('hidden');
            gameActive = true;
            resetGameState();
            audioSys.startBGM();
        }

        // Reset Game State
        function resetGameState() {
            path = [{ ...START_POS }];
            hearts = 3;
            gameActive = true;
            updateHeartsUI();
            updateGridState();
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('victory-modal').classList.add('hidden');
            
            setTimeout(() => {
                updatePathAndAvatarPosition();
            }, 50);
        }

        // Handle Cell Tap / Click
        function handleCellClick(r, c) {
            if (!gameActive) return;

            const currentPos = path[path.length - 1];

            // If user clicks current position, ignore
            if (r === currentPos.r && c === currentPos.c) return;

            // Check if clicking previous cell to undo step
            if (path.length > 1) {
                const prevPos = path[path.length - 2];
                if (r === prevPos.r && c === prevPos.c) {
                    path.pop();
                    audioSys.playStep();
                    updateGridState();
                    updatePathAndAvatarPosition();
                    return;
                }
            }

            // Check adjacency
            const isAdjacent = Math.abs(r - currentPos.r) + Math.abs(c - currentPos.c) === 1;
            const currentVal = gridData[currentPos.r][currentPos.c];
            const clickedVal = gridData[r][c];

            // Rule 1: Difference must be 9
            const isDiffNine = Math.abs(currentVal - clickedVal) === 9;
            // Rule 2: Cannot revisit previous cells in path
            const isVisited = path.some(p => p.r === r && p.c === c);

            if (isAdjacent && isDiffNine && !isVisited) {
                // Correct Move!
                path.push({ r, c });
                audioSys.playStep();
                updateGridState();
                updatePathAndAvatarPosition();

                // Check Win Condition
                if (r === END_POS.r && c === END_POS.c) {
                    handleWin();
                }
            } else if (isAdjacent) {
                // Invalid Adjacent Move -> Lose Heart & Shake Cell Red
                handleWrongMove(r, c);
            }
        }

        // Handle Invalid Move
        function handleWrongMove(r, c) {
            audioSys.playError();
            hearts--;
            updateHeartsUI();

            const cell = document.getElementById(`cell-${r}-${c}`);
            cell.classList.add('wrong-shake');
            setTimeout(() => cell.classList.remove('wrong-shake'), 400);

            const gameCard = document.getElementById('game-card');
            gameCard.classList.add('shake-anim');
            setTimeout(() => gameCard.classList.remove('shake-anim'), 400);

            if (hearts <= 0) {
                gameActive = false;
                audioSys.stopBGM();
                setTimeout(() => {
                    document.getElementById('gameover-modal').classList.remove('hidden');
                }, 400);
            }
        }

        // Update Grid Cells Visuals
        function updateGridState() {
            const currentPos = path[path.length - 1];
            document.getElementById('step-count').innerText = path.length;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    cell.className = 'grid-cell';

                    const isInPath = path.some(p => p.r === r && p.c === c);
                    const isCurrent = (r === currentPos.r && c === currentPos.c);

                    if (isCurrent) {
                        cell.classList.add('current');
                    } else if (isInPath) {
                        cell.classList.add('visited');
                    } else {
                        // 所有相鄰且「未走過」的探索格子全部標示藍色虛線框
                        const isAdjacent = Math.abs(r - currentPos.r) + Math.abs(c - currentPos.c) === 1;
                        if (isAdjacent) {
                            cell.classList.add('adjacent-target');
                        }
                    }
                }
            }
        }

        // Update Path Line SVG and Move Avatar
        function updatePathAndAvatarPosition() {
            if (path.length === 0) return;

            const gridEl = document.getElementById('maze-grid');
            const svg = document.getElementById('path-svg');
            const avatarContainer = document.getElementById('avatar-container');

            svg.innerHTML = '';

            const points = path.map(p => {
                const cell = document.getElementById(`cell-${p.r}-${p.c}`);
                const rect = cell.getBoundingClientRect();
                const boardRect = gridEl.getBoundingClientRect();
                return {
                    x: rect.left - boardRect.left + rect.width / 2,
                    y: rect.top - boardRect.top + rect.height / 2,
                    left: rect.left - boardRect.left,
                    top: rect.top - boardRect.top,
                    width: rect.width,
                    height: rect.height
                };
            });

            // Drawing path line
            if (points.length > 1) {
                let pathD = `M ${points[0].x} ${points[0].y}`;
                for (let i = 1; i < points.length; i++) {
                    pathD += ` L ${points[i].x} ${points[i].y}`;
                }

                const pathElem = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathElem.setAttribute('d', pathD);
                pathElem.setAttribute('stroke', '#f59e0b');
                pathElem.setAttribute('stroke-width', '7');
                pathElem.setAttribute('stroke-linecap', 'round');
                pathElem.setAttribute('stroke-linejoin', 'round');
                pathElem.setAttribute('fill', 'none');
                pathElem.setAttribute('opacity', '0.85');
                svg.appendChild(pathElem);
            }

            // Move Avatar Container onto current cell badge
            const lastPoint = points[points.length - 1];
            avatarContainer.style.transform = `translate(${lastPoint.left}px, ${lastPoint.top}px)`;
            avatarContainer.style.width = `${lastPoint.width}px`;
            avatarContainer.style.height = `${lastPoint.height}px`;
        }

        // Hearts UI Renderer
        function updateHeartsUI() {
            const container = document.getElementById('hearts-container');
            const heartIcons = container.querySelectorAll('.heart-icon');
            heartIcons.forEach((icon, idx) => {
                if (idx < hearts) {
                    icon.className = 'fas fa-heart heart-icon text-rose-500 scale-100';
                } else {
                    icon.className = 'far fa-heart heart-icon text-slate-300 scale-90';
                }
            });
        }

        // Win Handler
        function handleWin() {
            gameActive = false;
            audioSys.stopBGM();
            audioSys.playWin();

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }

            document.getElementById('victory-char').innerText = selectedAvatarName;
            document.getElementById('victory-steps').innerText = path.length;

            setTimeout(() => {
                document.getElementById('victory-modal').classList.remove('hidden');
            }, 500);
        }

        // Toggle Sound & Music State
        function toggleSound() {
            isSoundOn = !isSoundOn;
            const soundBtn = document.getElementById('sound-btn');
            if (isSoundOn) {
                soundBtn.innerHTML = '<i class="fas fa-volume-up text-lg"></i>';
                soundBtn.className = 'w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold shadow-sm hover:bg-indigo-200 transition';
                if (gameActive) audioSys.startBGM();
            } else {
                soundBtn.innerHTML = '<i class="fas fa-volume-mute text-lg"></i>';
                soundBtn.className = 'w-10 h-10 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold shadow-sm hover:bg-slate-300 transition';
            }
        }

        // Restart Game
        function restartGame() {
            resetGameState();
            if (isSoundOn) audioSys.startBGM();
        }
    </script>
</body>
</html>
